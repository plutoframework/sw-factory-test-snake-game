name: Validation
on:
  push:
  pull_request:
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test and QA normal defaults
        run: |
          npm test
          npm run qa
      - name: Test and QA both feature profiles
        run: |
          for profile in none all; do
            SNAKE_FEATURES="$profile" npm test
            SNAKE_FEATURES="$profile" npm run qa
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/qa/
          if-no-files-found: warn
